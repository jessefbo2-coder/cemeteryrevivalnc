<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quote – Cemetery Revival NC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #f8f8f8;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header, footer {
      background-color: #2e6e4e;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }
    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    h2 {
      text-align: center;
      color: #2e6e4e;
    }
    label {
      font-weight: bold;
    }
    input, textarea, button {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }
    button.btn {
      background-color: #2e6e4e;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    button.btn:hover {
      background-color: #24563c;
    }
    .weather-options {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .weather-options label {
      cursor: pointer;
    }
    .weather-img {
      width: 180px;
      height: auto;
      border-radius: 6px;
      border: 2px solid #ccc;
      transition: border-color 0.2s ease;
    }
    .weather-options input[type="radio"]:checked + .weather-img {
      border-color: #2e6e4e;
    }
    .error-message {
      color: #b30000;
      font-weight: bold;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>Cemetery Revival NC</h1>
  <p>Headstone
