<style>
:root{
  --cream:#f0ebdf;--light:#f8f4e9;--green:#21442f;--deep:#10281b;
  --gold:#c79b45;--sage:#dfe6d2;--text:#20352a;--muted:#526057;
  --line:#d5d0c2;--serif:"Fraunces",Georgia,serif;--sans:"Work Sans",Arial,sans-serif;
  --max:1220px;
}

/* GLOBAL */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:var(--sans);
  line-height:1.35;
}

a{text-decoration:none;color:inherit}

.wrap{
  width:min(var(--max),100%);
  margin:auto;
  padding:0 26px;
}

/* ANIMATION CLASSES */
.fade-in{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .6s ease, transform .6s ease;
}

.fade-in.visible{
  opacity:1;
  transform:translateY(0);
}

.hero-load{
  opacity:0;
  transform:translateY(25px);
  animation:heroFade .9s ease forwards;
}

@keyframes heroFade{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* BUTTON ANIMATION */
.btn{
  display:inline-block;
  background:var(--gold);
  color:#18281e;
  padding:10px 18px;
  font-size:.67rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.07em;
  border-radius:2px;
  transition:transform .25s ease, box-shadow .25s ease;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 4px 10px rgba(0,0,0,.18);
}

/* CARD HOVER */
.addon{
  transition:transform .25s ease, box-shadow .25s ease;
}

.addon:hover{
  transform:translateY(-4px);
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

/* HEADER */
header{
  height:70px;
  background:var(--light);
  border-bottom:1px solid rgba(32,53,42,.15);
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.brand img{
  width:255px;
  height:66px;
  object-fit:contain;
  object-position:left center;
}

.nav-links{
  display:flex;
  gap:34px;
  font:500 .82rem var(--serif);
}

.nav-links a{
  padding:5px 0;
  border-bottom:2px solid transparent;
}

.nav-links a:hover,
.nav-links a.active{
  border-color:var(--green);
}

.phone{
  font-weight:700;
  color:var(--green);
  white-space:nowrap;
}

.phone span{
  font-size:1.05rem;
  margin-right:8px;
}

.menu{
  display:none;
  border:0;
  background:none;
  color:var(--green);
  font-size:1.5rem;
}

/* MOBILE MENU PANEL */
.mobile-nav{
  display:none;
  flex-direction:column;
  background:var(--light);
  padding:20px;
  border-bottom:1px solid rgba(0,0,0,.15);
}

.mobile-nav a{
  padding:10px 0;
  font-family:var(--serif);
  font-size:1rem;
  border-bottom:1px solid rgba(0,0,0,.1);
}

.mobile-nav.show{
  display:flex;
}

/* HERO */
.hero{
  min-height:285px;
  position:relative;
  overflow:hidden;
  background:#1d3b29;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(90deg,rgba(13,42,25,.91) 0%,rgba(13,42,25,.72) 30%,rgba(13,42,25,.18) 62%,rgba(13,42,25,.03) 100%),
    url("assets/hero.jpg");
  background-size:auto 100%,cover;
  background-position:center,center 42%;
  background-repeat:no-repeat;
  filter:saturate(.95);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(11,38,23,.35),transparent 65%);
}

.hero-content{
  position:relative;
  z-index:2;
  padding:45px 0 50px;
  color:#fff;
}

.hero .kicker{color:#f0dfac}

.hero h1{
  font-size:clamp(2.15rem,4vw,3.3rem);
  line-height:.96;
  max-width:590px;
  color:#fff;
}

.hero p.lede{
  max-width:470px;
  margin:12px 0 17px;
  color:#f1eee5;
  font:400 .94rem/1.3 var(--serif);
}

<!-- JAVASCRIPT -->
<script>
// MOBILE MENU
const menuBtn = document.querySelector('.menu');
const mobileNav = document.getElementById('mobileNav');

menuBtn.addEventListener('click', () => {
  mobileNav.classList.toggle('show');
});

// CLOSE MOBILE MENU WHEN CLICKING A LINK
mobileNav.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    mobileNav.classList.remove('show');
  });
});

// SCROLL ANIMATIONS
const fadeElements = document.querySelectorAll('.fade-in');

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, {
  threshold: 0.2
});

fadeElements.forEach(el => observer.observe(el));
</script>
