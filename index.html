<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cemetery Revival NC</title>

    <style>
        /* --- COLOR PALETTE --- */
        :root {
            --sage: #A9B8A5;
            --sage-dark: #7C8F7A;
            --sage-gradient: linear-gradient(135deg, #A9B8A5, #7C8F7A);
            --gray-light: #F2F2F2;
            --gray-medium: #D9D9D9;
            --gray-dark: #4A4A4A;
            --white: #FFFFFF;
        }

        body {
            margin: 0;
            font-family: "Georgia", serif;
            background: var(--white);
            color: var(--gray-dark);
            line-height: 1.6;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            width: 100%;
            height: 65vh;
            background: url('assets/hero.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(60, 75, 60, 0.45); /* deeper sage overlay */
        }

        .hero-content {
            position: relative;
            z-index: 2;
            color: var(--white);
            padding: 0 20px;
            text-shadow: 0px 2px 6px rgba(0,0,0,0.4);
        }

        .hero h1 {
            font-size: 2.8rem;
            margin: 0;
        }

        .hero p {
            font-size: 1.3rem;
            margin: 12px 0 25px;
        }

        .btn {
            background: var(--sage-dark);
            color: var(--white);
            padding: 14px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1.1rem;
            display: inline-block;
            box-shadow: 0px 3px 8px rgba(0,0,0,0.25);
        }

        /* --- SECTION STYLES --- */
        section {
            padding: 60px 20px;
            max-width: 1100px;
            margin: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: var(--sage-dark);
        }

        /* --- GALLERY --- */
        .gallery {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .gallery img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
        }

        .services {
            display: grid;
            grid-template-columns: 1fr;
