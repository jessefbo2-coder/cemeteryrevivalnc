<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skySplit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b7684"/>
      <stop offset="50%" stop-color="#6b7684"/>
      <stop offset="50%" stop-color="#a9d3f0"/>
      <stop offset="100%" stop-color="#a9d3f0"/>
    </linearGradient>
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e2ddd0"/>
    </linearGradient>
    <linearGradient id="dirtyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7568"/>
      <stop offset="100%" stop-color="#524f43"/>
    </linearGradient>
    <clipPath id="stoneShape">
      <path d="M 30 42
               C 30 24, 36 12, 50 12
               C 64 12, 70 24, 70 42
               L 70 86
               L 30 86
               Z"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#skySplit)"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#b8863a" stroke-width="3"/>

  <ellipse cx="50" cy="88" rx="30" ry="5" fill="#2f3b30"/>

  <g clip-path="url(#stoneShape)">
    <rect x="30" y="12" width="20" height="76" fill="url(#dirtyGrad)"/>
    <rect x="50" y="12" width="20" height="76" fill="url(#cleanGrad)"/>
  </g>

  <path d="M 30 42
           C 30 24, 36 12, 50 12
           C 64 12, 70 24, 70 42
           L 70 86
           L 30 86
           Z"
        fill="none" stroke="#2f3b30" stroke-width="2.5"/>
  <line x1="50" y1="13" x2="50" y2="86" stroke="#2f3b30" stroke-width="1.5" opacity="0.4"/>
</svg>
